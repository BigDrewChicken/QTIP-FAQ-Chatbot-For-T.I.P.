<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q-TIP | TIP Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static\style.css">
</head>
<body>
  <main class="app">
    <header class="masthead">
      <h1 class="logo">Q-TIP</h1>
      <p class="tagline">Your TIP Assistant</p>
    </header>

    <section id="chat" class="chat" aria-live="polite" aria-label="Conversation">
      <div class="msg bot">
        <span class="who">Q-TIP</span>
        <p class="bubble">Hello! I'm your TIP assistant. How can I help you?</p>
      </div>
    </section>

    <form id="composer" class="composer" autocomplete="off">
      <label for="message" class="sr-only">Your message</label>
      <input id="message" type="text" placeholder="Ask me something about TIP..." maxlength="500" autofocus>
      <button type="submit" id="send">Send</button>
    </form>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
