<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q-TIP | TIP Assistant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/script.js" defer></script>
</head>

<body>
  <!-- TIP website mockup is the full-page background -->

  <!-- Floating Q-TIP launcher -->
  <button
    id="qtip-launcher"
    class="qtip-launcher"
    type="button"
    aria-label="Open Q-TIP assistant"
    aria-controls="qtip-window"
    aria-expanded="false"
  >
    Q
  </button>

  <!-- Floating chatbot window -->
  <main
    id="qtip-window"
    class="app"
    role="dialog"
    aria-label="Q-TIP assistant"
    aria-modal="false"
    hidden
  >
    <header class="masthead">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">Q</div>
        <div class="brand-text">
          <h1 class="logo">Q-TIP</h1>
          <p class="tagline">Your TIP Assistant</p>
        </div>
      </div>

      <button
        id="close-qtip"
        class="close-btn"
        type="button"
        aria-label="Close Q-TIP"
        title="Close"
      >
        &times;
      </button>
    </header>

    <section
      id="chat"
      class="chat"
      aria-live="polite"
      aria-label="Conversation"
    >
      <div class="msg bot">
        <span class="who">Q-TIP</span>
        <p class="bubble">Hello! I'm your TIP assistant. How can I help you?</p>
      </div>

      <!-- Quick questions -->
      <div id="quick-replies" class="quick-replies" role="group" aria-label="Quick questions">
        <button type="button" class="quick-reply" data-question="How can I enroll?">Enrollment</button>
        <button type="button" class="quick-reply" data-question="How can I contact you?">Contact Info</button>
        <button type="button" class="quick-reply" data-question="What documents does TIP request from new applicants?">Admission Requirements</button>
      </div>
    </section>

    <form id="composer" class="composer" autocomplete="off">
      <label for="message" class="sr-only">Your message</label>

      <input
        id="message"
        name="message"
        type="text"
        placeholder="Ask me something about TIP..."
        maxlength="500"
        autocomplete="off"
      >

      <button type="submit" id="send">Send</button>
    </form>
  </main>
</body>
</html>
